spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/applicationdb}
spring.datasource.username=${DB_USERNAME:application}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true

eodhd.api.base-url=https://eodhd.com/api
eodhd.api.token=${EODHD_API_TOKEN:}
eodhd.import.initial-date=${EODHD_IMPORT_INITIAL_DATE:2000-01-01}
